[project]
name = "ma_poc"
version = "0.1.0"
description = "MA Rent Intelligence Platform — Phase A POC"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "llm: test requires a live LLM provider (skip with -m 'not llm')",
    "db: test requires a real Postgres instance (skipped unless POSTGRES_TEST_DSN is set)",
    "ts: test requires a Node.js toolchain",
    "slow: test takes > 2s wall-clock — excluded from the default CI run",
    "e2e: full pipeline through all 4 layers (extract → propagate → persist → consume)",
    "live_network: test genuinely hits the real internet — exempt from the _probe network guard (see conftest.py)",
    "probe_seam: test drives _probe.probe_get/probe_post directly with the transport (curl_cffi) mocked underneath — exempt from the network guard",
]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = false
warn_unused_ignores = false
exclude = ["tests/fixtures/.*"]

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "patchright.*",
    "curl_cffi.*",
    "extruct.*",
    "timezonefinder.*",
    "respx.*",
    "aiofiles.*",
    "lxml.*",
    "bs4.*",
    "PIL.*",
    "google.cloud.*",
    "google.cloud.storage.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# Legacy modules reused by the strict-checked layers. pms/ and reporting/
# import a few helpers from these modules, but the source files themselves
# carry a lot of untyped Playwright / LLM / Azure code we don't strict-check
# today. Treat them as opaque so the adapter & reporting layers stay strict
# while the legacy code can be typed incrementally.
[[tool.mypy.overrides]]
module = [
    "ma_poc.scripts.entrata",
    "ma_poc.scripts.scrape_properties",
    "ma_poc.services.*",
]
ignore_errors = true
follow_imports = "skip"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
