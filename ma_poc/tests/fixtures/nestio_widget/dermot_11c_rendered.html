template, just with different per-unit values.

  unit_number: 11C
  bedrooms: studio (rendered as "-")
  bathrooms: 1
  sqft: 561
  rent: $4,212
  fee: No Fee
  availability_date: 05 / 05 / 2026
  address: 101 West End Avenue, Upper West Side, Manhattan, NY, 10023
-->
<!DOCTYPE html>
<html><head><title>Dermot Company | Apartment</title></head><body>
<div id="apt-results">
  <nav><a id="apt-contact-us">Contact Us</a></nav>

  <div id="apt-title-container">
    <h1 id="apt-title">101 West End Avenue #11C</h1>
  </div>
