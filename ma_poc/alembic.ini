[alembic]
# Alembic config for the data-provider SQL schema.
# Run from the ma_poc/ directory:
#   alembic -c alembic.ini upgrade head
#   alembic -c alembic.ini revision --autogenerate -m "describe change"
#
# `sqlalchemy.url` is left blank so the URL is resolved from DATABASE_URL
# at runtime (see data_provider/alembic/env.py).
script_location = data_provider/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
