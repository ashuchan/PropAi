name: reusable-python-setup

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      install-dev:
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            ma_poc/requirements.txt
            ma_poc/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if ${{ inputs.install-dev }}; then
            pip install -r ma_poc/requirements-dev.txt testcontainers[postgres]
          else
            pip install -r ma_poc/requirements.txt
          fi
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ma_poc/requirements.txt') }}
