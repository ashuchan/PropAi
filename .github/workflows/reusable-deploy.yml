name: reusable-deploy

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string         # staging or prod
      git-ref:
        required: true
        type: string         # sha or tag to deploy
      require-approval:
        required: false
        type: boolean
        default: false       # prod sets true
    secrets:
      WIF_PROVIDER:
        required: true
      WIF_SA:
        required: true
      GCP_PROJECT_ID:
        required: true

permissions:
  contents: read
  id-token: write            # required for WIF
  pull-requests: write       # for TF plan comments

env:
  REGION: us-central1
  AR_REPO: jugnu-images

jobs:
  # ── Gate 0: approval (prod only) ─────────────────────────────────────────────
  approval:
    if: inputs.require-approval
    runs-on: ubuntu-latest
    environment: production  # GitHub Environment with required reviewers
    steps:
      - run: echo "Approved for production deploy of ${{ inputs.git-ref }}"

  # ── Steps 1-3: auth, build and push image ────────────────────────────────────
  # The Cloud SQL wake-up step used to live here, but on a first-time deploy the
  # instance is created by terraform-apply *after* build-and-push — so the wake
  # step hit 404s. It now lives in ensure-sql (below), between terraform-apply
  # and migrate, which is where it's actually needed.
  build-and-push:
    needs: [approval]
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-uri: ${{ steps.tag.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          TAG="${{ inputs.env }}-${SHORT_SHA}"
          URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/jugnu:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${URI}" >> $GITHUB_OUTPUT

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.uri }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/jugnu:${{ inputs.env }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Steps 4-5: Terraform plan + apply ─────────────────────────────────────────
  terraform-apply:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=jugnu-tfstate-${{ inputs.env }}" \
            -backend-config="prefix=terraform/state"

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=envs/${{ inputs.env }}.tfvars \
            -var="image_tag=${{ needs.build-and-push.outputs.image-tag }}" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color > plan.txt 2>&1 || true
          cat plan.txt
          # Flag destructive changes
          if grep -qE '# .+ will be destroyed' plan.txt; then
            echo "destructive=true" >> $GITHUB_OUTPUT
          fi

      - name: Block destructive changes on prod
        if: steps.plan.outputs.destructive == 'true' && inputs.env == 'prod'
        run: |
          echo "Destructive TF changes detected on prod. Refusing to apply."
          echo "These must be landed via an explicit infra PR with extra review."
          exit 1

      - name: Apply
        run: terraform apply -auto-approve tfplan

  # ── Step 5a: wake Cloud SQL (instance exists now; may be STOPPED at rest) ────
  ensure-sql:
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Wake Cloud SQL
        run: |
          INSTANCE="jugnu-db-${{ inputs.env }}"
          # No 2>/dev/null here — if describe fails we want to see the reason,
          # not coerce it to "UNKNOWN" and then fail opaquely at patch.
          state=$(gcloud sql instances describe "$INSTANCE" \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(state)')
          if [ "$state" != "RUNNABLE" ]; then
            echo "SQL state: $state — starting..."
            gcloud sql instances patch "$INSTANCE" \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --activation-policy=ALWAYS --quiet
            for i in $(seq 1 36); do
              sleep 5
              state=$(gcloud sql instances describe "$INSTANCE" \
                --project=${{ secrets.GCP_PROJECT_ID }} \
                --format='value(state)')
              [ "$state" = "RUNNABLE" ] && echo "SQL is RUNNABLE" && break
            done
            [ "$state" = "RUNNABLE" ] || { echo "SQL did not start in time"; exit 1; }
          else
            echo "SQL is already RUNNABLE"
          fi

  # ── Step 6: migrations ─────────────────────────────────────────────────────────
  migrate:
    needs: [ensure-sql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ma_poc/requirements.txt

      - run: pip install -r ma_poc/requirements.txt

      - name: Install cloud-sql-proxy
        run: |
          curl -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/

      - name: Apply migrations
        env:
          GCP_PROJECT_ID_STAGING: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_ID_PROD: ${{ secrets.GCP_PROJECT_ID }}
        run: python ma_poc/scripts/migrate.py --env ${{ inputs.env }} up

      - name: Confirm migration status
        env:
          GCP_PROJECT_ID_STAGING: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_ID_PROD: ${{ secrets.GCP_PROJECT_ID }}
        run: python ma_poc/scripts/migrate.py --env ${{ inputs.env }} status

  # ── Step 7: CSV sync ───────────────────────────────────────────────────────────
  sync-csv:
    needs: [migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ma_poc/requirements.txt

      - run: pip install -r ma_poc/requirements.txt

      - name: Upload property list
        run: |
          if [ -f data/property-list/properties.csv ]; then
            python ma_poc/scripts/deploy_csv_sync.py --env ${{ inputs.env }}
          else
            echo "No property list CSV found at data/property-list/properties.csv — skipping"
          fi

  # ── Steps 8-9: smoke test + mark known-good ───────────────────────────────────
  smoke:
    needs: [sync-csv, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ma_poc/requirements.txt

      - run: pip install -r ma_poc/requirements.txt

      - name: Run smoke test
        run: python ma_poc/scripts/trigger_smoke.py --env ${{ inputs.env }} --yes

      - name: Tag image as known-good
        run: |
          SOURCE_URI="${{ needs.build-and-push.outputs.image-uri }}"
          TARGET_TAG="${{ inputs.env }}-known-good"
          TARGET_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/jugnu:${TARGET_TAG}"
          gcloud artifacts docker tags add "$SOURCE_URI" "$TARGET_URI" \
            --project=${{ secrets.GCP_PROJECT_ID }}
          echo "Tagged $SOURCE_URI as $TARGET_URI"
