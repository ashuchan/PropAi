name: reusable-deploy

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string         # staging or prod
      git-ref:
        required: true
        type: string         # sha or tag to deploy
      require-approval:
        required: false
        type: boolean
        default: false       # prod sets true
    secrets:
      WIF_PROVIDER:
        required: true
      WIF_SA:
        required: true
      GCP_PROJECT_ID:
        required: true

permissions:
  contents: read
  id-token: write            # required for WIF
  pull-requests: write       # for TF plan comments

env:
  REGION: us-central1
  AR_REPO: jugnu-images

jobs:
  # ── Gate 0: approval (prod only) ─────────────────────────────────────────────
  approval:
    if: inputs.require-approval
    runs-on: ubuntu-latest
    environment: production  # GitHub Environment with required reviewers
    steps:
      - run: echo "Approved for production deploy of ${{ inputs.git-ref }}"

  # ── Steps 1-3: auth, build and push image ────────────────────────────────────
  # The Cloud SQL wake-up step used to live here, but on a first-time deploy the
  # instance is created by terraform-apply *after* build-and-push — so the wake
  # step hit 404s. It now lives in ensure-sql (below), between terraform-apply
  # and migrate, which is where it's actually needed.
  build-and-push:
    needs: [approval]
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-uri: ${{ steps.tag.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          TAG="${{ inputs.env }}-${SHORT_SHA}"
          URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/jugnu:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${URI}" >> $GITHUB_OUTPUT

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.uri }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/jugnu:${{ inputs.env }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Steps 4-5: Terraform plan + apply ─────────────────────────────────────────
  terraform-apply:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=jugnu-tfstate-${{ inputs.env }}" \
            -backend-config="prefix=terraform/state"

      # terraform plan refreshes the google_sql_user resources, which the
      # Google provider cannot read while the instance has
      # activation_policy=NEVER ("instance is not running"). On a repeat
      # deploy the instance already exists but is stopped by the nightly
      # stop-cron — wake it here. On a genuine first-time deploy the
      # instance doesn't exist yet and this step is a no-op (404 tolerated);
      # terraform-apply creates it, and the post-apply ensure-sql job below
      # handles waking it for subsequent steps.
      - uses: google-github-actions/setup-gcloud@v2

      - name: Wake Cloud SQL before plan (if instance exists)
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          case "${{ inputs.env }}" in
            prod) TF_ENV="production" ;;
            *)    TF_ENV="${{ inputs.env }}" ;;
          esac
          INSTANCE="jugnu-db-${TF_ENV}"

          state=$(gcloud sql instances describe "$INSTANCE" \
            --project="$PROJECT" --format='value(state)' 2>/dev/null || echo "NOT_FOUND")
          if [ "$state" = "NOT_FOUND" ]; then
            echo "Instance $INSTANCE does not exist yet — first-time deploy. Skipping wake."
            exit 0
          fi
          if [ "$state" = "RUNNABLE" ]; then
            echo "Instance $INSTANCE is already RUNNABLE."
            exit 0
          fi

          # Fire-and-forget the patch. `gcloud sql instances patch` without
          # --async blocks synchronously for however long Cloud SQL takes
          # to wake (observed: 5+ min on cold starts). Submit the op, then
          # poll state ourselves with a real deadline.
          echo "Instance $INSTANCE state: $state — submitting wake operation..."
          gcloud sql instances patch "$INSTANCE" \
            --project="$PROJECT" --activation-policy=ALWAYS --async --quiet

          # Poll up to 10 min. Valid transient states: MAINTENANCE,
          # PENDING_CREATE, PENDING_DELETE. Anything else terminal we bail.
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 10
            state=$(gcloud sql instances describe "$INSTANCE" \
              --project="$PROJECT" --format='value(state)' 2>/dev/null || echo "UNKNOWN")
            echo "  state=$state"
            case "$state" in
              RUNNABLE)
                echo "Instance is RUNNABLE."
                exit 0
                ;;
              MAINTENANCE|PENDING_CREATE|UNKNOWN)
                continue
                ;;
              *)
                echo "::error::Instance entered unexpected state '$state' during wake. Aborting."
                exit 1
                ;;
            esac
          done
          echo "::error::Instance $INSTANCE still not RUNNABLE after 10 minutes (last state: $state)."
          exit 1

      - name: Plan
        id: plan
        run: |
          # -detailed-exitcode: 0=no changes, 1=plan error, 2=changes present.
          # The old script swallowed all exit codes via `|| true`, which let
          # plan errors fall through to `terraform apply` — which then failed
          # with the unhelpful "Cannot apply incomplete plan". Capture the
          # exit code, print the plan, and fail fast on 1.
          set +e
          terraform plan \
            -var-file=envs/${{ inputs.env }}.tfvars \
            -var="image_tag=${{ needs.build-and-push.outputs.image-tag }}" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color > plan.txt 2>&1
          rc=$?
          set -e
          cat plan.txt
          if [ "$rc" -eq 1 ]; then
            echo ""
            echo "::error::terraform plan failed (exit 1). See plan.txt output above."
            exit 1
          fi
          # Flag destructive changes (only relevant when rc=2, i.e. changes)
          if grep -qE '# .+ will be destroyed' plan.txt; then
            echo "destructive=true" >> $GITHUB_OUTPUT
          fi

      - name: Block destructive changes on prod
        if: steps.plan.outputs.destructive == 'true' && inputs.env == 'prod'
        run: |
          echo "Destructive TF changes detected on prod. Refusing to apply."
          echo "These must be landed via an explicit infra PR with extra review."
          exit 1

      - name: Apply
        run: terraform apply -auto-approve tfplan

  # ── Step 5a: wake Cloud SQL (instance exists now; may be STOPPED at rest) ────
  ensure-sql:
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Wake Cloud SQL
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Workflow input is the short name (prod/staging) so it matches
          # image tag conventions, but the Cloud SQL instance name comes
          # from the TF var `env`, which is "production" in prod.tfvars.
          # Map here so the instance lookup uses the long form.
          case "${{ inputs.env }}" in
            prod) TF_ENV="production" ;;
            *)    TF_ENV="${{ inputs.env }}" ;;
          esac
          INSTANCE="jugnu-db-${TF_ENV}"

          state=$(gcloud sql instances describe "$INSTANCE" \
            --project="$PROJECT" --format='value(state)')
          if [ "$state" = "RUNNABLE" ]; then
            echo "SQL is already RUNNABLE"
            exit 0
          fi

          # --async: submit the patch and return immediately. A synchronous
          # patch can block for 5+ min on cold starts; poll explicitly
          # instead with a deadline we control.
          echo "SQL state: $state — submitting wake operation..."
          gcloud sql instances patch "$INSTANCE" \
            --project="$PROJECT" --activation-policy=ALWAYS --async --quiet

          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 10
            state=$(gcloud sql instances describe "$INSTANCE" \
              --project="$PROJECT" --format='value(state)' 2>/dev/null || echo "UNKNOWN")
            echo "  state=$state"
            case "$state" in
              RUNNABLE)
                echo "SQL is RUNNABLE."
                exit 0
                ;;
              MAINTENANCE|PENDING_CREATE|UNKNOWN)
                continue
                ;;
              *)
                echo "::error::Instance entered unexpected state '$state' during wake. Aborting."
                exit 1
                ;;
            esac
          done
          echo "::error::SQL instance $INSTANCE still not RUNNABLE after 10 minutes (last state: $state)."
          exit 1

  # ── Step 6: migrations ─────────────────────────────────────────────────────────
  migrate:
    needs: [ensure-sql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ma_poc/requirements.txt

      - run: pip install -r ma_poc/requirements.txt

      - name: Install cloud-sql-proxy
        run: |
          curl -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/

      - name: Apply migrations
        env:
          GCP_PROJECT_ID_STAGING: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_ID_PROD: ${{ secrets.GCP_PROJECT_ID }}
        run: python ma_poc/scripts/migrate.py --env ${{ inputs.env }} up

      - name: Confirm migration status
        env:
          GCP_PROJECT_ID_STAGING: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_ID_PROD: ${{ secrets.GCP_PROJECT_ID }}
        run: python ma_poc/scripts/migrate.py --env ${{ inputs.env }} status

  # ── Step 7: CSV sync ───────────────────────────────────────────────────────────
  sync-csv:
    needs: [migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ma_poc/requirements.txt

      - run: pip install -r ma_poc/requirements.txt

      - name: Upload property list
        # The CSV lives at the repo root and is committed so every deploy sees
        # the same source of truth. Previously the workflow pointed at
        # `data/property-list/properties.csv`, which was never populated, so
        # sync-csv silently skipped and prod started every run with no
        # property list.
        run: |
          if [ -f properties.csv ]; then
            python ma_poc/scripts/deploy_csv_sync.py --env ${{ inputs.env }} --path properties.csv
          else
            echo "::error::properties.csv missing at repo root — deploy cannot seed the prod bucket."
            exit 1
          fi

  # ── Steps 8-9: smoke test + mark known-good ───────────────────────────────────
  smoke:
    needs: [sync-csv, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ma_poc/requirements.txt

      - run: pip install -r ma_poc/requirements.txt

      - name: Run smoke test
        # trigger_smoke.py is CI-only and has no confirmation prompt, so no
        # --yes (that flag lives on trigger_run.py / trigger_retry.py).
        # _trigger_common resolves the project from GCP_PROJECT_ID_{STAGING,PROD}
        # with GCP_PROJECT_ID as a fallback; forward the single CI secret so
        # the lookup doesn't hit its placeholder.
        env:
          GCP_PROJECT_ID_STAGING: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_ID_PROD: ${{ secrets.GCP_PROJECT_ID }}
        run: python ma_poc/scripts/trigger_smoke.py --env ${{ inputs.env }}

      - name: Tag image as known-good
        run: |
          SOURCE_URI="${{ needs.build-and-push.outputs.image-uri }}"
          TARGET_TAG="${{ inputs.env }}-known-good"
          TARGET_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/jugnu:${TARGET_TAG}"
          gcloud artifacts docker tags add "$SOURCE_URI" "$TARGET_URI" \
            --project=${{ secrets.GCP_PROJECT_ID }}
          echo "Tagged $SOURCE_URI as $TARGET_URI"
